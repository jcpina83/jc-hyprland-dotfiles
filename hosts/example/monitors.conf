# ==============================================================================
# jc-hyprland-dotfiles
# Example monitor configuration
#
# Copy to:
#
#   ~/.config/jc-hyprland-dotfiles/local/monitors.conf
#
# Never commit real monitor serial numbers or EDID identifiers.
# ==============================================================================


# ------------------------------------------------------------------------------
# Example dual-monitor vertical layout
# ------------------------------------------------------------------------------

# Secondary monitor above
monitor = DP-2, preferred, 0x0, 1

# Main monitor below
monitor = DP-1, preferred, 0x1080, 1


# ------------------------------------------------------------------------------
# Workspace assignment
# ------------------------------------------------------------------------------

workspace = 1, monitor:DP-1, default:true
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-1
workspace = 4, monitor:DP-1
workspace = 5, monitor:DP-1

workspace = 6, monitor:DP-2, default:true
workspace = 7, monitor:DP-2
workspace = 8, monitor:DP-2
workspace = 9, monitor:DP-2
workspace = 10, monitor:DP-2