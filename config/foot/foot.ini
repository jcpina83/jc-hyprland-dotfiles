# ==============================================================================
# jc-hyprland-dotfiles
# Theme: Odyssey Glass
# Component: Foot
# ==============================================================================

[main]

# Use the user's configured login shell ($SHELL).
# This keeps the configuration distro-agnostic.

font=JetBrainsMono Nerd Font:size=16,Symbols Nerd Font Mono:size=16
font-size-adjustment=0.5

dpi-aware=no

pad=14x12

initial-window-size-chars=110x32

app-id=jc-foot
title=Foot — Odyssey Glass

bold-text-in-bright=palette-based

selection-target=clipboard

box-drawings-uses-font-glyphs=no


# ==============================================================================
# Scrollback
# ==============================================================================

[scrollback]

lines=10000
multiplier=3.0
indicator-position=relative


# ==============================================================================
# Cursor
# ==============================================================================

[cursor]

style=beam
unfocused-style=hollow

blink=yes
blink-rate=650

beam-thickness=1.5


# ==============================================================================
# Odyssey Glass palette
# ==============================================================================

[colors-dark]

foreground=cdd6f4
background=11111b

# Glass transparency
alpha=0.82
alpha-mode=matching

# Cursor:
# foreground background
cursor=11111b 89b4fa

# Selection
selection-foreground=11111b
selection-background=89b4fa

# URL mode
urls=74c7ec

# Search
search-box-no-match=11111b f38ba8
search-box-match=11111b a6e3a1

# Scrollback indicator
scrollback-indicator=11111b 89b4fa


# ------------------------------------------------------------------------------
# ANSI 0-7
# ------------------------------------------------------------------------------

regular0=45475a
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=cba6f7
regular6=94e2d5
regular7=bac2de


# ------------------------------------------------------------------------------
# ANSI bright 8-15
# ------------------------------------------------------------------------------

bright0=585b70
bright1=f38ba8
bright2=a6e3a1
bright3=f9e2af
bright4=89b4fa
bright5=cba6f7
bright6=89dceb
bright7=cdd6f4


# ==============================================================================
# Client-side decorations
# ==============================================================================

[csd]

preferred=server