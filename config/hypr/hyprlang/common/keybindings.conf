# ==============================================================================
# jc-hyprland-dotfiles
# Common keybindings
# ==============================================================================


# ------------------------------------------------------------------------------
# Terminal
#
# Garuda currently binds:
#
#   SUPER + code:36 -> footclient
#
# We remove both possible forms so this override also remains portable to
# distributions/configurations that bind Enter by keysym instead of keycode.
# ------------------------------------------------------------------------------

unbind = SUPER, code:36
unbind = SUPER, RETURN

$terminal = ~/.config/jc-hyprland-dotfiles/bin/launch-foot.sh

bind = SUPER, RETURN, exec, $terminal