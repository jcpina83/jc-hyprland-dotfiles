# ==============================================================================
# jc-hyprland-dotfiles
# Odyssey Glass
# Hyprland 0.54.x animations
# ==============================================================================

animations {
    enabled = true


    # --------------------------------------------------------------------------
    # Curves
    # --------------------------------------------------------------------------

    # Smooth entrance / exit.
    bezier = odysseyEase, 0.16, 1.00, 0.30, 1.00

    # Workspace / window movement.
    bezier = odysseyMove, 0.22, 1.00, 0.36, 1.00

    # Opacity transitions.
    bezier = odysseyFade, 0.40, 0.00, 0.20, 1.00


    # --------------------------------------------------------------------------
    # Windows
    # --------------------------------------------------------------------------

    animation = windows, 1, 3, odysseyEase, popin 94%

    animation = windowsMove, 1, 2, odysseyMove


    # --------------------------------------------------------------------------
    # Fade
    # --------------------------------------------------------------------------

    animation = fade, 1, 2, odysseyFade


    # --------------------------------------------------------------------------
    # Layer-shell surfaces
    #
    # Waybar / Wofi / SwayNC
    # --------------------------------------------------------------------------

    animation = layers, 1, 3, odysseyEase, fade


    # --------------------------------------------------------------------------
    # Workspaces
    # --------------------------------------------------------------------------

    animation = workspaces, 1, 3, odysseyMove, slidefade 12%

    animation = specialWorkspace, 1, 3, odysseyEase, slidefadevert 15%


    # --------------------------------------------------------------------------
    # Borders
    # --------------------------------------------------------------------------

    animation = border, 1, 3, odysseyFade
}