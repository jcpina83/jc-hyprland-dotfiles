# ==============================================================================
# jc-hyprland-dotfiles
# Odyssey Glass
# Hyprland 0.54.x appearance
# ==============================================================================


# ------------------------------------------------------------------------------
# Window layout
# ------------------------------------------------------------------------------

general {
    border_size = 2

    gaps_in = 6
    gaps_out = 12
    gaps_workspaces = 6

    resize_on_border = true

    col.active_border = $odyssey_primary $odyssey_secondary 45deg
    col.inactive_border = rgba(313244aa)
}


# ------------------------------------------------------------------------------
# Window decoration
# ------------------------------------------------------------------------------

decoration {
    rounding = 14
    rounding_power = 2.4

    # Keep application contents fully opaque.
    # Glass is primarily applied to layer-shell UI:
    # Waybar, Wofi, SwayNC, etc.
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0

    dim_inactive = false


    # --------------------------------------------------------------------------
    # Shadow
    # --------------------------------------------------------------------------

    shadow {
        enabled = true

        range = 16
        render_power = 3

        sharp = false
        ignore_window = true

        color = $odyssey_shadow

        offset = 0 4
    }


    # --------------------------------------------------------------------------
    # Blur
    #
    # Balanced for desktop / high-resolution monitors.
    # --------------------------------------------------------------------------

    blur {
        enabled = true

        size = 5
        passes = 2

        ignore_opacity = true
        new_optimizations = true

        # We want launcher / notification surfaces to see the content
        # behind them instead of only the wallpaper.
        xray = false

        noise = 0.0117
        contrast = 0.90
        brightness = 0.96

        vibrancy = 0.16
        vibrancy_darkness = 0.05

        popups = true
        popups_ignorealpha = 0.20
    }
}


# ==============================================================================
# LAYER SHELL
#
# Hyprland layer surfaces:
#   Waybar
#   Wofi
#   SwayNC
# ==============================================================================


# ------------------------------------------------------------------------------
# Waybar
# ------------------------------------------------------------------------------

layerrule {
    name = odyssey_waybar_blur

    blur = on
    ignore_alpha = 0.15

    match:namespace = ^waybar$
}


# ------------------------------------------------------------------------------
# Wofi
# ------------------------------------------------------------------------------

layerrule {
    name = odyssey_wofi_blur

    blur = on
    ignore_alpha = 0.15

    match:namespace = ^wofi$
}


# ------------------------------------------------------------------------------
# SwayNotificationCenter
#
# Match all SwayNC layer-shell surfaces so both notifications and the
# control-center can participate in Odyssey Glass.
# ------------------------------------------------------------------------------

layerrule {
    name = odyssey_swaync_blur

    blur = on
    ignore_alpha = 0.12

    match:namespace = ^swaync.*$
}