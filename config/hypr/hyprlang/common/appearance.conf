# jc-hyprland-dotfiles - appearance
# Conservative defaults for Hyprland 0.54.x.

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = $od_primary $od_secondary 45deg
    col.inactive_border = rgba(6c708680)
    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.96

    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = true
        xray = false
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00000055)
    }
}
