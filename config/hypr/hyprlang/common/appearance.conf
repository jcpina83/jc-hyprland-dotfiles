# ==============================================================================
# jc-hyprland-dotfiles
# Hyprland appearance
#
# The active theme provides:
#
#   $theme_bg
#   $theme_bg_alt
#   $theme_surface
#   $theme_surface_alt
#   $theme_foreground
#   $theme_muted
#   $theme_primary
#   $theme_secondary
#   $theme_accent
#   $theme_green
#   $theme_yellow
#   $theme_red
#   $theme_shadow
#
# through:
#
#   ~/.config/jc-hyprland-dotfiles/theme/colors.conf
#
# Target:
#   Hyprland 0.54.x
# ==============================================================================


# ==============================================================================
# GENERAL
# ==============================================================================

general {

    # --------------------------------------------------------------------------
    # Borders
    # --------------------------------------------------------------------------

    border_size = 2

    col.active_border = $theme_primary $theme_secondary 45deg

    col.inactive_border = rgba(313244aa)


    # --------------------------------------------------------------------------
    # Gaps
    # --------------------------------------------------------------------------

    gaps_in = 6
    gaps_out = 12

    gaps_workspaces = 6


    # --------------------------------------------------------------------------
    # Window interaction
    # --------------------------------------------------------------------------

    resize_on_border = true
}


# ==============================================================================
# DECORATION
# ==============================================================================

decoration {

    # --------------------------------------------------------------------------
    # Rounded windows
    # --------------------------------------------------------------------------

    rounding = 14
    rounding_power = 2.4


    # --------------------------------------------------------------------------
    # Opacity
    #
    # Application windows stay opaque.
    #
    # Glass/transparency is primarily handled by Waybar, Wofi, SwayNC,
    # Foot and other themed surfaces.
    # --------------------------------------------------------------------------

    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0


    # --------------------------------------------------------------------------
    # Dimming
    # --------------------------------------------------------------------------

    dim_inactive = false


    # ==========================================================================
    # SHADOW
    # ==========================================================================

    shadow {

        enabled = true

        range = 16

        render_power = 3

        sharp = false

        ignore_window = true

        color = $theme_shadow

        offset = 0 4
    }


    # ==========================================================================
    # BLUR
    #
    # Balanced configuration for high-resolution / high-refresh desktop use.
    #
    # This is intentionally moderate:
    #
    #   size   = 5
    #   passes = 2
    #
    # rather than using aggressive blur passes.
    # ==========================================================================

    blur {

        enabled = true

        size = 5
        passes = 2


        # ----------------------------------------------------------------------
        # Optimization
        # ----------------------------------------------------------------------

        ignore_opacity = true

        new_optimizations = true


        # ----------------------------------------------------------------------
        # X-Ray
        #
        # false means transparent surfaces can blur actual content behind them,
        # rather than treating everything as wallpaper-only blur.
        # ----------------------------------------------------------------------

        xray = false


        # ----------------------------------------------------------------------
        # Visual tuning
        # ----------------------------------------------------------------------

        noise = 0.0117

        contrast = 0.90

        brightness = 0.96

        vibrancy = 0.16

        vibrancy_darkness = 0.05


        # ----------------------------------------------------------------------
        # Popup blur
        # ----------------------------------------------------------------------

        popups = true

        popups_ignorealpha = 0.20
    }
}


# ==============================================================================
# LAYER-SHELL RULES
#
# Blur is enabled only for selected desktop UI surfaces.
#
# Component transparency continues to be controlled by each component's
# generated CSS/theme configuration.
# ==============================================================================


# ------------------------------------------------------------------------------
# Waybar
# ------------------------------------------------------------------------------

layerrule {
    name = jc_waybar_blur

    blur = on

    ignore_alpha = 0.15

    match:namespace = ^waybar$
}


# ------------------------------------------------------------------------------
# Wofi
# ------------------------------------------------------------------------------

layerrule {
    name = jc_wofi_blur

    blur = on

    ignore_alpha = 0.15

    match:namespace = ^wofi$
}


# ------------------------------------------------------------------------------
# SwayNotificationCenter
#
# Matches both notification surfaces and the control center.
# ------------------------------------------------------------------------------

layerrule {
    name = jc_swaync_blur

    blur = on

    ignore_alpha = 0.12

    match:namespace = ^swaync.*$
}